server:
  address: 127.0.0.1
  port: ${PORT:8081}
  shutdown: graceful
  max-http-request-header-size: 16KB
spring:
  application.name: curriculum
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 16
      minimum-idle: 2
      connection-timeout: 1000
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    user: ${FLYWAY_USER}
    password: ${FLYWAY_PASSWORD}
  lifecycle.timeout-per-shutdown-phase: 30s
management:
  endpoints.web.exposure.include: health
  endpoint.health:
    probes.enabled: true
    show-details: never
    group.readiness.include: readinessState,db
app:
  origin: ${APP_ORIGIN:http://localhost:3000}
  secure-cookie: ${SECURE_COOKIE:false}
  session-key: ${SESSION_SIGNING_KEY}
  context-key: ${CONTEXT_SIGNING_KEY}
  csrf-key: ${CSRF_SIGNING_KEY}
  operation-key: ${OPERATION_HMAC_KEY}
