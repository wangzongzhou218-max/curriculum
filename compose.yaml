name: curriculum-system-dev
services:
  mysql:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: curriculum
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/Initialize-LocalConfig.ps1 first}
      MYSQL_USER: curriculum_migrator
      MYSQL_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:?Run scripts/Initialize-LocalConfig.ps1 first}
      MYSQL_PWD: ${MYSQL_MIGRATION_PASSWORD:?Run scripts/Initialize-LocalConfig.ps1 first}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs
      - --transaction-isolation=READ-COMMITTED
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./.tools/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u curriculum_migrator -D curriculum -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
volumes:
  mysql-data:
